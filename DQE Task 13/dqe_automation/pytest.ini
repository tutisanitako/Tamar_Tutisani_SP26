[pytest]
; --- registered custom marks: needed so -m "smoke" etc. never warns/fails ---
markers =
    smoke: fast checks that confirm the object/report/page exists and is reachable
    critical: checks that cover the main business logic / most-used functionality
    unit: isolated checks against a single DB object (table/view), no external dependency
    integration: checks that cross a boundary between two systems (API <-> API, source <-> target)
    ui: Selenium browser checks against the Power BI playground report

; fail the run if someone uses @pytest.mark.something that was not registered above
addopts = --strict-markers -ra --alluredir=allure-results --clean-alluredir